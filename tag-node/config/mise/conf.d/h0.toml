# Headless-node mise layer — the tool set for accounts on machines carrying the
# `node` tag. Universal tools belong in the untagged root's
# config/mise/conf.d/ instead; nothing here reaches a desktop (TAGS="desktop").
#
# This repo owns the set. ADR-0043 moved user-scoped packages out of the s0n
# project: the infra layer provisions only the node-wide mise binary and its
# /etc/profile.d activation, and the fragment `roles/mise` used to render is
# tombstoned. Edit this file directly — nothing regenerates it.
#
# A conf.d fragment, layered over the account's own ~/.config/mise/config.toml
# (never touched). Keep fragment filenames distinct per layer, or one layer's
# file shadows the other's instead of both merging. Dropping a line only stops
# *activating* a tool — `mise uninstall <tool> --all` reclaims the disk.
[settings]
# Scriptable trust (ADR-0033): project mise configs under these paths load
# without an interactive `mise trust` — new checkouts/worktrees included.
trusted_config_paths = ["~/projects", "/var/devops/s0n/projects"]
[tools]
node = "26"
"npm:@anthropic-ai/claude-code" = { version = "latest", allow_builds = [
  "@anthropic-ai/claude-code",
] }
"npm:claude-code-templates" = "latest"
"npm:@beads/bd" = { version = "latest", allow_builds = ["@beads/bd"] }
"npm:@googleworkspace/cli" = { version = "latest", allow_builds = [
  "@googleworkspace/cli",
] }
"npm:@mariozechner/pi-coding-agent" = "latest"
"npm:@oh-my-pi/pi-coding-agent" = { version = "latest", allow_builds = [
  "@oh-my-pi/pi-coding-agent",
] }
"npm:@playwright/mcp" = "0.0.83"
"npm:@opencode/cli" = { version = "latest", allow_builds = ["@opencode/cli"] }
"npm:openwiki" = "latest"
"herdr" = "latest"
"pypi:browser-harness" = "latest"
"pypi:graphifyy" = "latest"
# --python 3.14: fastuuid (via litellm) ships no cp315 wheel and its sdist
# pins PyO3 0.26, which refuses 3.15. Drop once fastuuid supports 3.15.
"pypi:headroom-ai" = { version = "latest", extras = ["code", "mcp"], uvx_args = "--python 3.14" }
python = "3.15"
"yt-dlp" = "latest"
# Runtime for `omp` (@oh-my-pi/pi-coding-agent): the package declares
# engines.bun and its bin execs bun, not node — without this it installs
# cleanly and then fails at first run.
bun = "latest"
fnox = "latest"
"npm:@dzhng/jevgrep" = "latest"
"npm:@microsoft/teams.cli" = "preview"
"npm:cf" = "1.0.0-beta.6"
